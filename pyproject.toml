[project]
name = "musictk"
version = "0.1.0"
description = "Music toolkit for managing audio tags, fetching lyrics, and organizing your music library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.8.0",
    "click>=8.1.0",
    "mutagen>=1.47.0",
    "requests>=2.31.0",
    "ytmusicapi>=1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "types-requests>=2.31.0",
]

[project.scripts]
musictk = "musictk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
module = "mutagen.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ytmusicapi.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
    "RUF",
    "ANN",
]
ignore = []
